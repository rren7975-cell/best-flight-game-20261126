<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Runner — 3-Stage Rescue Flight</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript>Ring Runner needs JavaScript to fly.</noscript>
<canvas id="game" aria-label="Ring Runner: pick one of three planes, fly 24 rings across three stages, buy upgrades between stages, then land on the runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
